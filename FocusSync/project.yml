name: FocusSync
options:
  bundleIdPrefix: com.focussync
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

targets:
  FocusSync:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: FocusSyncApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focussync.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: FocusSync
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
